name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/joshuanmoses/piCloud/blob/main/SECURITY.md) for how to report one privately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a non-administrator
        2. Open a folder shared with you
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From `/api/v1/version`, or the commit you built.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Raspberry Pi 5
        - Raspberry Pi 4
        - Other ARM64
        - x86-64
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `docker compose logs app --tail 100`. Check them over before pasting —
        paths and usernames may be in there.
      render: text
