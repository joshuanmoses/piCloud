# Continuous integration for PiFiles.
#
# Four jobs, deliberately separate so a failure names what broke rather than
# "the build". They run in parallel; nothing here depends on anything else.
#
# The ARM64 image build is the one people forget. PiFiles exists to run on a
# Raspberry Pi, and a dependency that quietly loses ARM64 support would
# otherwise be discovered by the first person to install it on a board.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: the older result is
# about code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The same major version the compose file runs. Testing against a different
    # one would leave the trigram search and the SKIP LOCKED job queue — the two
    # places PiFiles leans on PostgreSQL specifics — unverified where it counts.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pifiles
          POSTGRES_PASSWORD: pifiles-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pifiles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Only dist/index.html is tracked; the hashed assets beside it are not.
      # A built index.html committed over the placeholder therefore produces a
      # clone that embeds markup referencing JavaScript nobody committed — and
      # the server cannot tell, so it starts cleanly and serves a blank page.
      # The Go suite asserts this too; it is repeated here so the failure is
      # named rather than buried among 632 tests.
      - name: Confirm the SPA entry point is the placeholder
        run: |
          if ! grep -q 'frontend not built' backend/internal/web/dist/index.html; then
            echo "::error file=backend/internal/web/dist/index.html::A built index.html was committed over the placeholder."
            exit 1
          fi

      # go.mod and go.sum must already be tidy. A CI that tidies for you hides
      # a dependency nobody chose to add.
      - name: Check dependencies are tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'make tidy' and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      # Everything in one pass: the unit tests and the tests that need a real
      # PostgreSQL. Without the environment variables below the integration
      # tests skip silently — which is exactly the failure CI exists to catch,
      # so the run is checked afterwards for skips rather than trusted.
      - name: Test
        working-directory: backend
        env:
          PIFILES_TEST_DATABASE_HOST: localhost
          PIFILES_TEST_DATABASE_PORT: 5432
          PIFILES_TEST_DATABASE_USER: pifiles
          PIFILES_TEST_DATABASE_PASSWORD: pifiles-test-password
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... 2>&1 | tee test-output.txt

      # The suite contains a few deliberate conditional skips, so "nothing
      # skipped" is the wrong assertion. This checks for the one skip that
      # would mean CI proved nothing: the integration package standing down
      # because it could not find a database.
      - name: Confirm the integration tests ran
        working-directory: backend
        run: |
          if grep -q 'PIFILES_TEST_DATABASE_HOST is not set' test-output.txt; then
            echo "Integration tests skipped: the database service was not reachable."
            exit 1
          fi
          echo "Integration tests ran against PostgreSQL."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      # The production build is a separate failure from the tests passing:
      # Vite's build applies transforms the dev server does not.
      - name: Build
        working-directory: frontend
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # shellcheck is optional locally, so backup_test.sh skips its lint checks
      # on a machine without it. In CI it is installed, so those checks run.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Test the backup, restore, and installer safety properties
        run: ./scripts/test/backup_test.sh

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Both architectures: amd64 because that is what most people develop on,
      # arm64 because that is what PiFiles is for. Not pushed anywhere —
      # PiFiles is distributed as source and built on the machine it runs on,
      # so this checks that the build works, not that an image is published.
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
